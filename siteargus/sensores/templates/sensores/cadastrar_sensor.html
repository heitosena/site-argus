
<!-- Define o padrão HTML5. -->
<!DOCTYPE html>

<!-- Inicia a página em português. -->
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% load static %}

    <!-- Conexão com o CSS. -->
    <link rel="stylesheet" href="{% static 'sensores/css/cadastrar_sensor.css' %}?v=7">

    <title>Cadastro de Dispositivos - A.R.G.U.S.</title>
</head>

<body>

    <!-- Mensagem de sucesso do Django. -->
    {% if messages %}
        {% for message in messages %}
            <div class="mensagem-sucesso">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <!-- Título da página. -->
    <h1>Cadastro de Dispositivo</h1>

    <!-- Formulário responsável pelo cadastro. -->
    <form method="post">

        {% csrf_token %}

        <!-- Nome do dispositivo. -->
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>

        <br><br>

        <!-- Modelo do dispositivo. -->
        <label for="modelo">Modelo</label>
        <input
            type="text"
            id="modelo"
            name="modelo"
            value="ESP32 - Sensor de Gás"
            required
        >

        <br><br>

        <!-- Status do dispositivo. -->
        <label for="status">Status</label>
        <select id="status" name="status" required>
            <option value="Ativo">Ativo</option>
            <option value="Inativo">Inativo</option>
            <option value="Manutenção">Manutenção</option>
        </select>

        <br><br>

        <!-- Conexão com a rede. -->
        <label for="rede_conectada">
            <input
                type="checkbox"
                id="rede_conectada"
                name="rede_conectada"
            >
            Rede conectada
        </label>

        <br><br>

        <!-- Botões de ação. -->
<div class="botoes-acoes">

    <!-- Botão de cadastro. -->
    <button type="submit">Cadastrar dispositivo</button>

    <!-- Botão para visualizar dispositivos cadastrados. -->
    <a href="{% url 'lista_sensores' %}" class="botao-lista">
        Voltar
    </a>

</div>

    </form>


    <script src="{% static 'sensores/js/cadastrar_sensor.js' %}?v=4"></script>

</body>

</html>
